map $http_x_forwarded_proto $seo_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS, resolved per request: nginx must boot even while service-catalog is down.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $seo_upstream http://service-catalog:3002;

    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $seo_proto;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;

    # Service worker + manifest must always revalidate
    location ~* (?:sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # Plain SPA shell (service worker precache + SEO renderer template)
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /robots.txt {
        proxy_pass $seo_upstream/seo/robots.txt;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @robots_static;
    }

    location @robots_static {
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        proxy_pass $seo_upstream/seo/sitemap.xml;
    }

    # Pages: server-rendered head + content for crawlers, then React takes over.
    location / {
        try_files $uri @seo;
    }

    location @seo {
        proxy_pass $seo_upstream/seo/render;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }

    location @spa {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
}
