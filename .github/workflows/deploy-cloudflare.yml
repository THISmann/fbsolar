# Deploy the Vite React SPA to Cloudflare Pages.
# Backend stays on the VPS behind https://api.fb-solar.com (Cloudflare proxied).
#
# Required GitHub Secrets:
#   CLOUDFLARE_API_TOKEN          Pages Edit + Zone DNS Edit (recommended)
#   CLOUDFLARE_ACCOUNT_ID         (also accepts typo CLOUDFLARE_ACCOUND_ID)
#   VITE_API_BASE                 e.g. https://api.fb-solar.com
# Optional:
#   CLOUDFLARE_PAGES_PROJECT_NAME e.g. fbsolar (default: fbsolar)
#   VPS_ORIGIN_IP                 e.g. 62.84.187.58 (default below)

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: write

    env:
      VITE_API_BASE: ${{ secrets.VITE_API_BASE || vars.VITE_API_BASE }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME || vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'fbsolar' }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUND_ID }}
      CUSTOM_DOMAIN: fb-solar.com
      VPS_ORIGIN_IP: ${{ secrets.VPS_ORIGIN_IP || vars.VPS_ORIGIN_IP || '62.84.187.58' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required config
        run: |
          missing=0
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID (or CLOUDFLARE_ACCOUND_ID)"
            missing=1
          fi
          if [ -z "$VITE_API_BASE" ]; then
            echo "::error::Missing secret/variable VITE_API_BASE (e.g. https://api.fb-solar.com)"
            missing=1
          fi
          echo "API base: $VITE_API_BASE"
          echo "Pages project: $CLOUDFLARE_PAGES_PROJECT_NAME"
          exit $missing

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @solar/web
        run: pnpm turbo run build --filter="@solar/web..."
        env:
          VITE_API_BASE: ${{ env.VITE_API_BASE }}

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project list || true
          if ! npx --yes wrangler@4 pages project list 2>/dev/null | grep -qiE "(^| )${CLOUDFLARE_PAGES_PROJECT_NAME}( |$)"; then
            npx --yes wrangler@4 pages project create "${CLOUDFLARE_PAGES_PROJECT_NAME}" --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4 pages deploy apps/web/dist
          --project-name="${CLOUDFLARE_PAGES_PROJECT_NAME}"
          --commit-dirty=true

      - name: Attach domain + DNS (Pages + API)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          CT="Content-Type: application/json"
          ZONE_JSON=$(curl -fsS -H "$AUTH" "https://api.cloudflare.com/client/v4/zones?name=${CUSTOM_DOMAIN}" || true)
          ZONE_ID=$(printf '%s' "$ZONE_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or []; print(r[0]['id'] if r else '')" 2>/dev/null || true)
          if [ -z "$ZONE_ID" ]; then
            echo "::warning::Zone ${CUSTOM_DOMAIN} not found or token lacks Zone:Read. Attach domains in the Cloudflare dashboard."
            exit 0
          fi
          echo "Zone ID: $ZONE_ID"

          # VPS only serves HTTP:80 — Flexible avoids Cloudflare 521 on api.*
          curl -sS -X PATCH -H "$AUTH" -H "$CT" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/settings/ssl" \
            --data '{"value":"flexible"}' | python3 -c "import sys,json; d=json.load(sys.stdin); print('SSL mode =>', (d.get('result') or {}).get('value'), 'success=', d.get('success'), d.get('errors'))" || true
          curl -sS -X PATCH -H "$AUTH" -H "$CT" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/settings/always_use_https" \
            --data '{"value":"on"}' >/dev/null || true

          for host in "$CUSTOM_DOMAIN" "www.$CUSTOM_DOMAIN"; do
            resp=$(curl -sS -X POST -H "$AUTH" -H "$CT" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT_NAME}/domains" \
              --data "{\"name\":\"${host}\"}" || true)
            echo "$resp" | python3 -c "import sys,json; d=json.load(sys.stdin); print('${host}', '=> success=', d.get('success'), 'errors=', d.get('errors'))" || echo "$host => $resp"
          done

          PAGES_TARGET="${CLOUDFLARE_PAGES_PROJECT_NAME}.pages.dev"
          upsert_dns() {
            local name="$1" type="$2" content="$3"
            local list existing body resp
            list=$(curl -fsS -H "$AUTH" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=${name}" || true)
            existing=$(printf '%s' "$list" | TYPE="$type" python3 -c "import sys,json,os; d=json.load(sys.stdin); t=os.environ['TYPE']; r=[x for x in (d.get('result') or []) if x.get('type')==t]; print(r[0]['id'] if r else '')" 2>/dev/null || true)
            body=$(NAME="$name" TYPE="$type" CONTENT="$content" python3 -c 'import json,os; print(json.dumps({"type":os.environ["TYPE"],"name":os.environ["NAME"],"content":os.environ["CONTENT"],"proxied":True,"ttl":1}))')
            if [ -n "$existing" ]; then
              resp=$(curl -sS -X PUT -H "$AUTH" -H "$CT" \
                "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${existing}" \
                --data "$body" || true)
            else
              resp=$(curl -sS -X POST -H "$AUTH" -H "$CT" \
                "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
                --data "$body" || true)
            fi
            echo "$resp" | NAME="$name" TYPE="$type" CONTENT="$content" python3 -c "import sys,json,os; d=json.load(sys.stdin); print(os.environ['TYPE'], os.environ['NAME'], '→', os.environ['CONTENT'], 'success=', d.get('success'), 'errors=', d.get('errors'))"
          }

          upsert_dns "$CUSTOM_DOMAIN" "CNAME" "$PAGES_TARGET" || echo "::warning::Could not set apex CNAME (need Zone DNS Edit)"
          upsert_dns "www.$CUSTOM_DOMAIN" "CNAME" "$PAGES_TARGET" || echo "::warning::Could not set www CNAME"
          upsert_dns "api.$CUSTOM_DOMAIN" "A" "$VPS_ORIGIN_IP" || echo "::warning::Could not set api A record"

          echo "Open https://www.${CUSTOM_DOMAIN} / https://${CUSTOM_DOMAIN} after DNS propagates."
