# =============================================================================
# Solar Platform — Docker Compose (infra + NestJS microservices)
# Usage:  docker compose up -d --build
# =============================================================================

name: solar

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.3
    container_name: solar-traefik
    restart: unless-stopped
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - solar-net
    depends_on:
      - api-gateway
      - service-auth
      - service-catalog
      - service-media
      - service-interaction
      - web

  # ---------------------------------------------------------------------------
  # Data stores
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: solar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-solar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
    networks:
      - solar-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solar} -d ${POSTGRES_DB:-solar}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: solar-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - solar-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: quay.io/minio/minio:latest
    container_name: solar-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - solar-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: solar-minio-init
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_HOST: minio
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-solar-assets}
    volumes:
      - ./docker/minio/create-bucket.sh:/create-bucket.sh:ro
    entrypoint: ["/bin/sh", "/create-bucket.sh"]
    networks:
      - solar-net
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: solar-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-solar}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-solar}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - solar-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # NestJS microservices
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: api-gateway
        NODE_VERSION: "20"
    container_name: solar-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      SERVICE_NAME: api-gateway
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    networks:
      - solar-net
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-gateway.rule=(Host(`api.localhost`) || Host(`localhost`)) && PathPrefix(`/`)"
      - "traefik.http.routers.api-gateway.entrypoints=web"
      - "traefik.http.routers.api-gateway.priority=1"
      - "traefik.http.services.api-gateway.loadbalancer.server.port=3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health/live',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  service-auth:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: service-auth
        NODE_VERSION: "20"
    container_name: solar-service-auth
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-solar}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-solar}?schema=auth
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      ALLOW_DEV_SEED: ${ALLOW_DEV_SEED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    networks:
      - solar-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=(Host(`api.localhost`) || Host(`localhost`)) && PathPrefix(`/api/auth`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.routers.auth.priority=100"
      - "traefik.http.middlewares.auth-strip.stripprefix.prefixes=/api/auth"
      - "traefik.http.routers.auth.middlewares=auth-strip"
      - "traefik.http.services.auth.loadbalancer.server.port=3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/health/live',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  service-catalog:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: service-catalog
        NODE_VERSION: "20"
    container_name: solar-service-catalog
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-solar}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-solar}?schema=catalog
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/1
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-solar}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-solar}
      AUTH_INTERNAL_URL: http://service-auth:3001
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:5173}
      SEO_SITE_URL: ${SEO_SITE_URL:-}
      SEO_TEMPLATE_URL: http://web/index.html
      SEO_BUSINESS_NAME: ${SEO_BUSINESS_NAME:-}
      SEO_BUSINESS_PHONE: ${SEO_BUSINESS_PHONE:-}
      SEO_BUSINESS_EMAIL: ${SEO_BUSINESS_EMAIL:-}
      SEO_BUSINESS_STREET: ${SEO_BUSINESS_STREET:-}
      SEO_BUSINESS_POSTAL_CODE: ${SEO_BUSINESS_POSTAL_CODE:-}
      SEO_BUSINESS_CITY: ${SEO_BUSINESS_CITY:-}
      SEO_BUSINESS_COUNTRY: ${SEO_BUSINESS_COUNTRY:-}
      SEO_CURRENCY: ${SEO_CURRENCY:-XOF}
      SEO_SAME_AS: ${SEO_SAME_AS:-}
      SEO_GOOGLE_VERIFICATION: ${SEO_GOOGLE_VERIFICATION:-}
      SEO_BING_VERIFICATION: ${SEO_BING_VERIFICATION:-}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN:-}
      FACEBOOK_GRAPH_VERSION: ${FACEBOOK_GRAPH_VERSION:-v21.0}
    networks:
      - solar-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.catalog.rule=(Host(`api.localhost`) || Host(`localhost`)) && PathPrefix(`/api/catalog`)"
      - "traefik.http.routers.catalog.entrypoints=web"
      - "traefik.http.routers.catalog.priority=100"
      - "traefik.http.middlewares.catalog-strip.stripprefix.prefixes=/api/catalog"
      - "traefik.http.routers.catalog.middlewares=catalog-strip"
      - "traefik.http.services.catalog.loadbalancer.server.port=3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3002/health/live',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  service-media:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: service-media
        NODE_VERSION: "20"
    container_name: solar-service-media
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-solar}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-solar}?schema=media
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-solar-assets}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost/api/media}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    networks:
      - solar-net
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.media.rule=(Host(`api.localhost`) || Host(`localhost`)) && PathPrefix(`/api/media`)"
      - "traefik.http.routers.media.entrypoints=web"
      - "traefik.http.routers.media.priority=100"
      - "traefik.http.middlewares.media-strip.stripprefix.prefixes=/api/media"
      - "traefik.http.routers.media.middlewares=media-strip"
      - "traefik.http.services.media.loadbalancer.server.port=3003"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3003/health/live',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  service-interaction:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: service-interaction
        NODE_VERSION: "20"
    container_name: solar-service-interaction
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3004
      DATABASE_URL: postgresql://${POSTGRES_USER:-solar}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-solar}?schema=interaction
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/2
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-solar}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-solar}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    networks:
      - solar-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.interaction.rule=(Host(`api.localhost`) || Host(`localhost`)) && PathPrefix(`/api/interaction`)"
      - "traefik.http.routers.interaction.entrypoints=web"
      - "traefik.http.routers.interaction.priority=100"
      - "traefik.http.middlewares.interaction-strip.stripprefix.prefixes=/api/interaction"
      - "traefik.http.routers.interaction.middlewares=interaction-strip"
      - "traefik.http.services.interaction.loadbalancer.server.port=3004"
      - "traefik.http.routers.ws.rule=(Host(`api.localhost`) || Host(`localhost`)) && PathPrefix(`/ws`)"
      - "traefik.http.routers.ws.entrypoints=web"
      - "traefik.http.routers.ws.priority=100"
      - "traefik.http.routers.ws.middlewares=ws-strip"
      - "traefik.http.middlewares.ws-strip.stripprefix.prefixes=/ws"
      - "traefik.http.routers.ws.service=interaction"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3004/health/live',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ---------------------------------------------------------------------------
  # Frontend (Vite build → nginx)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NODE_VERSION: "20"
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost}
    container_name: solar-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    networks:
      - solar-net
    labels:
      - "traefik.enable=true"
      # Site SPA on localhost (API keeps higher priority via /api and /ws)
      - "traefik.http.routers.web.rule=(Host(`localhost`) || Host(`www.localhost`)) && !PathPrefix(`/api`) && !PathPrefix(`/ws`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.routers.web.priority=50"
      - "traefik.http.services.web.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/index.html"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  solar-net:
    name: solar-net
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  rabbitmq_data:
