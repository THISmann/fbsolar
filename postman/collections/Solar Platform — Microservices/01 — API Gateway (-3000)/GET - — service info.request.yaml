$kind: http-request
name: GET / — service info
url: "{{gateway_url}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('service is api-gateway', () => pm.expect(body.service).to.eql('api-gateway'));
      pm.test('message contains running', () => pm.expect(body.message).to.include('running'));
    language: text/javascript
order: 1000
