$kind: http-request
name: GET /health/live
url: "{{gateway_url}}/health/live"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Liveness OK', () => pm.expect(pm.response.json().status).to.eql('ok'));
    language: text/javascript
order: 3000
