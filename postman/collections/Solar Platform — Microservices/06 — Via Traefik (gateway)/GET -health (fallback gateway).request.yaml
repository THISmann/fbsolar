$kind: http-request
name: GET /health (fallback gateway)
url: "{{traefik_url}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Fallback to api-gateway', () => pm.expect(pm.response.json().service).to.eql('api-gateway'));
    language: text/javascript
order: 5000
