$kind: http-request
name: GET /api/auth/health
url: "{{traefik_url}}/api/auth/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Proxied to auth', () => pm.expect(pm.response.json().service).to.eql('service-auth'));
    language: text/javascript
order: 1000
