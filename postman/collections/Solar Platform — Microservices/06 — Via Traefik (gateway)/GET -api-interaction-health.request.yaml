$kind: http-request
name: GET /api/interaction/health
url: "{{traefik_url}}/api/interaction/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Proxied to interaction', () => pm.expect(pm.response.json().service).to.eql('service-interaction'));
    language: text/javascript
order: 4000
