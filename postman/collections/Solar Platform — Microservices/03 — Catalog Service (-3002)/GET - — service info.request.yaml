$kind: http-request
name: GET / — service info
url: "{{catalog_url}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('service is service-catalog', () => pm.expect(pm.response.json().service).to.eql('service-catalog'));
    language: text/javascript
order: 1000
