$kind: http-request
name: GET /health
url: "{{auth_url}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Health OK', () => {
        pm.expect(body.status).to.eql('ok');
        pm.expect(body.service).to.eql('service-auth');
      });
    language: text/javascript
order: 2000
