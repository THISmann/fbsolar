$kind: http-request
name: GET / — service info
url: "{{auth_url}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('service is service-auth', () => pm.expect(body.service).to.eql('service-auth'));
    language: text/javascript
order: 1000
